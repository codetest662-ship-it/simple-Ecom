{% extends 'base.html' %}
{% block content %}
<h2>Store Products</h2>
<p>Click any product to view details and choose a quantity.</p>
<div style="display: flex; gap: 15px; flex-wrap: wrap;">
    {% for product in products %}
    <div class="card">
        <h3><a class="title-link" href="{{ url_for('product_detail', product_id=product.id) }}">{{ product.name }}</a></h3>
        <p>Price: ${{ "%.2f"|format(product.price) }}</p>
        <a href="{{ url_for('product_detail', product_id=product.id) }}">View Details &amp; Add to Cart</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
