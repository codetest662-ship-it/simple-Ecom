{% extends "base.html" %}

{% block title %}Create Account — SHOP.CO{% endblock %}

{% block extra_css %}
<style>
  .auth-wrapper {
    max-width: 440px;
    margin: 40px auto;
    padding: 36px 32px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background-color: var(--white);
  }
  .auth-title {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 24px;
  }
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .auth-input {
    height: 48px;
    border-radius: 999px;
    border: 1px solid #cccccc;
    padding: 0 20px;
    font-size: 15px;
    outline: none;
  }
  .auth-btn {
    height: 48px;
    border-radius: 999px;
    border: none;
    background-color: var(--black);
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .auth-footer a {
    color: var(--black);
    font-weight: 700;
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <h1 class="auth-title">CREATE ACCOUNT</h1>

    <form class="auth-form" method="POST" action="/register">
      <input type="text" name="username" class="auth-input" placeholder="Username" required />
      <input type="email" name="email" class="auth-input" placeholder="Email" required />
      <input type="password" name="password" class="auth-input" placeholder="Password" required />
      <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log In.</a>
    </div>
  </div>
</div>
{% endblock %}
