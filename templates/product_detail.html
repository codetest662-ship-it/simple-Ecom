{% extends 'base.html' %}
{% block content %}
<p><a href="{{ url_for('home') }}">&larr; Back to Store</a></p>

<h2>{{ product.name }}</h2>
<p><strong>Price:</strong> ${{ "%.2f"|format(product.price) }}</p>
<p><strong>Details:</strong> {{ product.description }}</p>

<form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}">
    <label for="quantity">Quantity (max 100):</label>
    <input type="number" id="quantity" name="quantity" min="1" max="100" value="1" required style="width: 70px; padding: 5px;">
    <button type="submit" style="padding: 6px 14px; margin-left: 8px;">Add to Cart</button>
</form>
{% endblock %}
