{% extends "base.html" %}

{% block title %}Edit Profile — SHOP.CO{% endblock %}

{% block extra_css %}
<style>
  .edit-wrapper {
    max-width: 500px;
    margin: 40px auto;
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background-color: var(--white);
  }
  .edit-title {
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .edit-input {
    height: 46px;
    border-radius: 999px;
    border: 1px solid #cccccc;
    padding: 0 18px;
    font-size: 15px;
  }
  .file-input {
    font-size: 14px;
  }
  .btn-save {
    height: 46px;
    border-radius: 999px;
    border: none;
    background-color: var(--black);
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <div class="edit-wrapper">
    <h1 class="edit-title">Edit Profile</h1>

    <form class="edit-form" method="POST" action="/profile/edit" enctype="multipart/form-data">
      <div class="form-group">
        <label for="profile_pic">Profile Picture</label>
        <input type="file" id="profile_pic" name="profile_pic" accept="image/*" class="file-input" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="edit-input" value="{{ current_user.username }}" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="edit-input" value="{{ current_user.email }}" required />
      </div>

      <button type="submit" class="btn-save">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
